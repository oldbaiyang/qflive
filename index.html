<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QFLive · 多画面直播墙</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header class="topbar">
  <button class="icon-btn" id="btnSidebar" title="收起 / 展开侧栏" aria-label="切换侧栏">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>

  <div class="brand">
    <div class="logo">QF</div>
    <div class="brand-text">
      <h1>QFLive</h1>
      <span>多画面直播墙</span>
    </div>
  </div>

  <div class="layouts" id="layoutPicker"></div>

  <div class="spacer"></div>

  <div class="top-actions">
    <button class="btn" id="btnMuteAll">全部静音</button>
    <button class="btn" id="btnReloadAll">全部重载</button>
    <button class="btn primary" id="btnFull">全屏</button>
  </div>
</header>

<div class="layout-root">
  <aside class="sidebar" id="sidebar">
    <section class="panel">
      <h2>添加直播源</h2>
      <form id="addForm" autocomplete="off">
        <input id="inputUrl" type="text" placeholder="粘贴 m3u8 / flv / mpd 地址" spellcheck="false">
        <input id="inputName" type="text" placeholder="名称（可选，留空自动取）" spellcheck="false">
        <button class="btn primary block" type="submit">添加到画面墙</button>
      </form>
      <p class="hint">支持 HLS(.m3u8)、HTTP-FLV(.flv)、DASH(.mpd)、MPEG-TS(.ts)、MP4。RTMP / RTSP 需转码。</p>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>频道列表</h2>
        <span class="count" id="srcCount">0</span>
      </div>
      <ul class="src-list" id="srcList"></ul>
      <div class="row-actions">
        <button class="btn tiny" id="btnImportFile">导入 m3u/txt</button>
        <button class="btn tiny" id="btnExport">导出</button>
        <button class="btn tiny danger" id="btnClear">清空</button>
      </div>
      <input type="file" id="fileInput" accept=".m3u,.m3u8,.txt,.json" hidden>
      <p class="hint">拖拽文件到画面区也能导入。列表项可拖动排序，双击改名。</p>
    </section>

    <section class="panel">
      <h2>设置</h2>
      <label class="switch"><input type="checkbox" id="optForceProxy"><span>所有源强制走代理</span></label>
      <label class="switch"><input type="checkbox" id="optMuted" checked><span>新画面默认静音</span></label>
      <label class="switch"><input type="checkbox" id="optReconnect" checked><span>断流自动重连</span></label>
      <label class="field" style="margin-top:10px">
        <span>自定义代理前缀（可选）</span>
        <input id="inputProxy" type="text" placeholder="留空使用本站 /api/proxy" spellcheck="false">
      </label>
      <p class="hint">默认直连，跨域或失败时自动降级到本站代理。本地纯静态调试时可填外部代理前缀。</p>
    </section>
  </aside>

  <main class="stage" id="stage">
    <div class="wall" id="wall"></div>

    <div class="empty-state" id="emptyState">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="14" height="14" rx="2"/><path d="M16 10l6-3v10l-6-3z"/></svg>
      </div>
      <h3>画面墙还是空的</h3>
      <p>在左侧粘贴直播地址，或直接载入一组示例源试试。</p>
      <button class="btn primary" id="btnDemo">载入示例源</button>
    </div>
  </main>
</div>

<div class="toasts" id="toasts"></div>

<script src="assets/player.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
